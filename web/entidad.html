<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Historial de entidad · SEACE · Xertica</title>
<style>
  :root { --azul:#047EA9; --rosa:#FF4DA6; --verde:#5e7d40; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Arial, Helvetica, sans-serif; background:#f3f4f6; color:#111827; }
  header { background:var(--azul); color:#fff; padding:18px 24px; }
  header h1 { margin:0; font-size:18px; }
  header p { margin:4px 0 0; font-size:12px; color:#bfe3f0; }
  main { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; }
  .panel { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:16px; margin-bottom:16px; }
  .kpis { display:flex; gap:14px; flex-wrap:wrap; }
  .kpi { background:#f9fafb; border:1px solid #eef0f2; border-radius:10px; padding:10px 16px; }
  .kpi b { display:block; font-size:20px; color:var(--azul); }
  .kpi span { font-size:11px; color:#6b7280; text-transform:uppercase; letter-spacing:.4px; }
  h2 { font-size:14px; color:var(--azul); margin:18px 0 10px; }
  .item { border:1px solid #eef0f2; border-radius:10px; padding:10px 14px; margin-bottom:8px; background:#fff; }
  .item .t { font-size:13px; font-weight:bold; color:#111827; line-height:1.4; }
  .item .m { font-size:12px; color:#6b7280; margin-top:4px; }
  .item .m b { color:#374151; }
  .chip { display:inline-block; font-size:11px; font-weight:bold; border-radius:10px; padding:1px 8px; margin-left:6px; }
  .prov { color:#92400e; background:#fef3c7; }
  a { color:var(--azul); }
</style>
</head>
<body>
<header>
  <h1>📊 Historial de compras públicas</h1>
  <p id="sub">Cargando…</p>
</header>
<main>
  <div class="panel"><div class="kpis" id="kpis"></div></div>
  <div class="panel">
    <h2 style="margin-top:0;">Procesos recientes</h2>
    <div id="procesos">⏳ Consultando al OECE…</div>
    <h2>Contratos firmados recientes</h2>
    <div id="contratos">⏳…</div>
    <p style="font-size:11px;color:#9ca3af;">Fuente: API de Contrataciones Abiertas del OECE (buyerProcesses / buyerContracts). Se listan los 50 más recientes de cada grupo.</p>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtFecha = (v) => v ? new Date(v).toLocaleDateString('es-PE', { day:'2-digit', month:'short', year:'numeric' }) : '—';
const fmtM = (n, mon = 'PEN') => (!n || n <= 0) ? null : (mon === 'PEN' ? 'S/ ' : mon + ' ') + Number(n).toLocaleString('es-PE', { maximumFractionDigits: 0 });

(async () => {
  const q = new URLSearchParams(location.search);
  const params = q.get('id') ? 'id=' + encodeURIComponent(q.get('id')) : 'nombre=' + encodeURIComponent(q.get('nombre') ?? '');
  try {
    const j = await (await fetch('/api/entidad?' + params)).json();
    if (j.error) throw new Error(j.error);
    document.title = j.entidad + ' · SEACE';
    $('sub').textContent = j.entidad + ' · ' + j.id;
    $('kpis').innerHTML = `
      <div class="kpi"><b>${Number(j.totalProcesos).toLocaleString('es-PE')}</b><span>procesos históricos</span></div>
      <div class="kpi"><b>${Number(j.totalContratos).toLocaleString('es-PE')}</b><span>contratos</span></div>`;
    $('procesos').innerHTML = (j.procesos ?? []).map((p) => `
      <div class="item">
        <div class="t">${esc(p.descripcion || p.nomenclatura)}</div>
        <div class="m">📅 <b>${fmtFecha(p.fecha)}</b> · ${esc(p.metodo || p.categoria || '')} ${fmtM(p.monto, p.moneda) ? '· <b>' + fmtM(p.monto, p.moneda) + '</b>' : ''}
          ${(p.estados ?? []).map((e) => `<span class="chip" style="color:#0369a1;background:#e0f2fe;">${esc(e)}</span>`).join('')}
          ${(p.proveedores ?? []).map((x) => `<span class="chip prov">🏆 ${esc(x)}</span>`).join('')}
        </div>
      </div>`).join('') || '<span style="color:#6b7280;font-size:13px;">Sin procesos.</span>';
    $('contratos').innerHTML = (j.contratos ?? []).map((c) => `
      <div class="item">
        <div class="t">${esc(c.titulo)}</div>
        <div class="m">✍️ Firmado: <b>${fmtFecha(c.firmado)}</b>
          ${fmtM(c.monto, c.moneda) ? '· <b>' + fmtM(c.monto, c.moneda) + '</b>' : ''}
          ${c.inicio ? '· Vigencia: ' + fmtFecha(c.inicio) + ' → ' + fmtFecha(c.fin) : ''}
          ${(c.proveedores ?? []).map((x) => `<span class="chip prov">🏆 ${esc(x)}</span>`).join('')}
        </div>
      </div>`).join('') || '<span style="color:#6b7280;font-size:13px;">Sin contratos.</span>';
  } catch (err) {
    $('sub').textContent = '❌ ' + err.message;
    $('procesos').textContent = ''; $('contratos').textContent = '';
  }
})();
</script>
</body>
</html>
